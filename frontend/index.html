<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Report Analyst</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="header-content">
      <h1>📊 AI Report Analyst</h1>
      <p class="subtitle">Your conversational assistant for data analysis</p>
    </div>
    <button id="toggleSidebar" class="btn-icon" title="Toggle panel">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>
  </header>

  <!-- ===== Main Layout ===== -->
  <div class="app-layout">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar open">
      <div class="sidebar-inner">

        <!-- Dataset Selection -->
        <section class="panel-section">
          <h3>📊 Select a MongoDB Dataset</h3>
          <div class="select-wrapper">
            <select id="datasetSelect">
              <option value="" disabled selected>Select dataset…</option>
            </select>
          </div>
          <button id="useDatasetBtn" class="btn btn-primary" disabled>
            ✅ Use This Dataset
          </button>
        </section>

        <div class="divider"></div>

        <!-- Upload Section -->
        <section class="panel-section">
          <h3>📁 Upload your own dataset</h3>
          <button id="showUploadBtn" class="btn btn-secondary">
            Upload CSV / Excel
          </button>

          <div id="uploadArea" class="upload-area hidden">
            <label class="field-label" for="collectionNameInput">MongoDB collection name</label>
            <input type="text" id="collectionNameInput" class="collection-name-input" maxlength="120" pattern="[A-Za-z0-9_-]+" placeholder="Enter a collection name" autocomplete="off" />
            <p class="field-hint">Use letters, numbers, underscores, or hyphens.</p>
            <label class="file-drop" id="fileDrop">
              <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden />
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="fileName">Choose a file or drag it here</span>
            </label>
            <button id="uploadBtn" class="btn btn-accent" disabled>
              🚀 Upload &amp; Store in MongoDB
            </button>
            <div id="uploadSpinner" class="spinner hidden">
              <div class="spinner-ring"></div>
              <span>Uploading…</span>
            </div>
          </div>
        </section>

        <div class="divider"></div>

        <!-- Chat History -->
        <section class="panel-section">
          <button id="clearChatBtn" class="btn btn-secondary">
            Clear chat history
          </button>
        </section>

        <!-- Connection Status -->
        <div class="connection-status" id="connectionStatus">
          <span class="status-dot"></span>
          <span class="status-text">Checking backend…</span>
        </div>
      </div>
    </aside>

    <!-- Chat Area -->
    <main class="chat-container">
      <div class="chat-messages" id="chatMessages" tabindex="0" aria-label="Chat history">
        <!-- Messages injected here -->
      </div>

      <!-- Chat Input -->
      <form class="chat-input-bar" id="chatForm">
        <input
          type="text"
          id="chatInput"
          placeholder="Tell me what you want to analyze…"
          autocomplete="off"
        />
        <button type="submit" class="btn-send" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </form>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
